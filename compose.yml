# Don't forget to run
# `docker compose up` with `ENVIRONMENT=base` set in `.env`
# the first time you run this project!

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: "${ENVIRONMENT}"
  PORT: "${PORT}"
  DEV_SPRING_DATASOURCE_URL: "${DEV_SPRING_DATASOURCE_URL}"
  TEST_SPRING_DATASOURCE_URL: "${TEST_SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_URL: "${DEV_SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
  SECURITY_JWT_TOKEN_SECRET_ACCESS_KEY: "${SECURITY_JWT_TOKEN_SECRET_ACCESS_KEY}"
  SECURITY_JWT_TOKEN_SECRET_REFRESH_KEY: "${SECURITY_JWT_TOKEN_SECRET_REFRESH_KEY}"
  SECURITY_JWT_TOKEN_ACCESS_TOKEN_LIFETIME: "${SECURITY_JWT_TOKEN_ACCESS_TOKEN_LIFETIME}"
  SECURITY_JWT_TOKEN_REFRESH_TOKEN_LIFETIME: "${SECURITY_JWT_TOKEN_REFRESH_TOKEN_LIFETIME}"
  SECURITY_AUTHENTICATION_CODES_LIFETIME: "${SECURITY_AUTHENTICATION_CODES_LIFETIME}"
  AZURE_REDIRECT_BASE_URL: "${AZURE_REDIRECT_BASE_URL}"
  AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
  AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"

services:
  app:
    container_name: "spring-auth-${ENVIRONMENT}"
    build:
      context: .
      dockerfile: Dockerfile
      target: "${ENVIRONMENT}"
    volumes:
      - ./target:/app/target
      - ./docs:/app/target/generated-snippets-html
    environment:
      <<: *spring-env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring_network
      - shared_network

  # JDK 21 + Maven 3.9, no Java install on the host.
  # Usage:
  #   docker compose --profile workspace up -d db java
  #   docker compose --profile workspace exec java mvn -v
  java:
    profiles: ["workspace"]
    image: maven:3.9.9-eclipse-temurin-21
    container_name: spring-auth-java
    working_dir: /app
    volumes:
      - .:/app
      - spring-auth-m2:/root/.m2
    environment:
      <<: *spring-env
      MAVEN_OPTS: "-Djava.awt.headless=true"
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring_network

  db:
    container_name: "spring-auth-mariadb"
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: "${ENVIRONMENT}_db"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  spring_network:
    driver: bridge

  shared_network:
    name: shared_network
    driver: bridge

volumes:
  spring-auth-m2:
