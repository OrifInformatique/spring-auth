# Database Configuration for Tests
spring.datasource.url=${TEST_SPRING_DATASOURCE_URL}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Configuration for Tests
security.jwt.token.secret-key=test-secret-key-for-jwt-authentication-do-not-use-in-production

# Disable Security for Tests
spring.security.basic.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging level configuration
logging.level.root=ERROR
logging.level.ch.sectioninformatique=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR

# Show SQL in stdout and stderr
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true