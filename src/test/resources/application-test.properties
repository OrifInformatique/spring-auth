# Test profile configuration.
# Values below are fallbacks: an environment variable with the same name (e.g. passed by
# docker compose) always takes precedence over them.

# Database: a dedicated MariaDB schema, recreated for each test run
spring.datasource.url=${TEST_SPRING_DATASOURCE_URL}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT and authentication codes. Test-only secrets, never used outside the test profile.
SECURITY_JWT_TOKEN_SECRET_ACCESS_KEY=test-access-secret-do-not-use-in-production
SECURITY_JWT_TOKEN_SECRET_REFRESH_KEY=test-refresh-secret-do-not-use-in-production
SECURITY_JWT_TOKEN_ACCESS_TOKEN_LIFETIME=5m
SECURITY_JWT_TOKEN_REFRESH_TOKEN_LIFETIME=30d
SECURITY_AUTHENTICATION_CODES_LIFETIME=5m

# Azure placeholders. The test profile registers its own ClientRegistrationRepository
# (see TestOAuth2ClientConfig), so no OpenID discovery call reaches Azure.
AZURE_TENANT_ID=test-tenant
AZURE_CLIENT_ID=test-client-id
AZURE_CLIENT_SECRET=test-client-secret
AZURE_REDIRECT_BASE_URL=http://localhost:8080

# Logging
logging.level.root=ERROR
logging.level.ch.sectioninformatique=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
